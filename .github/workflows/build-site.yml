name: 'Build Site'
on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          echo "Building version ${{github.ref_name}}"
          bash ./build-site.sh ${{github.ref_name}}
      # Only publish the site for tagged releases. Other builds just check that the site builds.
      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/')
        id: upload
        uses: softprops/action-gh-release@v1
        with:
          files: site.tar.gz
      - name: Webhook
        if: startsWith(github.ref, 'refs/tags/')
        uses: joelwmale/webhook-action@2.3.2
        with:
          url: ${{ secrets.WEBHOOK_URL }}
          body: '{"file": "${{ steps.upload.outputs.url }}/site.tar.gz", "release": "${{github.ref}}", "secret": "${{ secrets.WEBHOOK_KEY }}"}'
